[project]
name = "comfyshop-worker"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = ["comfyshop-worker-protocol", "httpx>=0.28,<1", "websockets>=15,<17", "filelock>=4.2.1,<5", "segno>=1.6,<2", "cryptography>=45,<51"]

[project.scripts]
comfyshop-worker = "comfyshop_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["comfyshop_worker"]

[tool.uv.sources]
comfyshop-worker-protocol = { workspace = true }
