[project]
name = "comfyshop-media"
version = "0.1.0"
requires-python = ">=3.12"
description = "Media validation, storage, and renditions for ComfyShop"
dependencies = [
  "anyio>=4,<5",
  "boto3>=1.36,<2",
  "filelock>=4.2.1,<5",
  "pillow>=13,<14",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.10,<3",
]

[dependency-groups]
dev = ["boto3-stubs[s3]>=1.36,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfyshop_media"]
