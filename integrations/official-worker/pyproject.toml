[project]
name = "comfyshop-official-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "comfyshop-worker-protocol",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.18,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
comfyshop-official-worker = "comfyshop_official_worker.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
comfyshop-worker-protocol = { workspace = true }
