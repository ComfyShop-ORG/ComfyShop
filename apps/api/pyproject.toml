[project]
name = "comfyshop-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "comfyshop-media",
  "comfyshop-runninghub-worker",
  "comfyshop-worker-protocol",
  "cryptography>=45,<51",
  "fastapi[standard-no-fastapi-cloud-cli]>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.41,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "pwdlib[argon2]>=0.2,<1",
  "py-vapid>=1.9,<2",
  "http-ece>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.uv.sources]
comfyshop-runninghub-worker = { workspace = true }
comfyshop-worker-protocol = { workspace = true }
comfyshop-media = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comfyshop_api"]

[tool.fastapi]
entrypoint = "comfyshop_api.main:app"
