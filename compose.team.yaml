name: comfyshop-team

x-app-image: &app-image
  build: .
  image: comfyshop:team

services:
  app:
    <<: *app-image
    extends:
      file: compose.app.yaml
      service: app
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - '${COMFYSHOP_TEAM_BIND:-0.0.0.0}:${COMFYSHOP_TEAM_PORT:-9688}:8688'
    environment:
      COMFYSHOP_DATABASE_URL: 'postgresql+psycopg://comfyshop:${COMFYSHOP_POSTGRES_PASSWORD:?set COMFYSHOP_POSTGRES_PASSWORD in the team env file}@db:5432/comfyshop'
    volumes:
      - data:/data

  comfyui-worker:
    extends:
      file: integrations/comfyui/compose.service.yaml
      service: comfyui-worker

  runninghub-worker:
    extends:
      file: integrations/runninghub-worker/compose.service.yaml
      service: runninghub-worker

  official-worker:
    extends:
      file: integrations/official-worker/compose.service.yaml
      service: official-worker
    image: &official-worker-image comfyshop-official-worker:team

  official-init:
    extends:
      file: integrations/official-worker/compose.service.yaml
      service: official-init
    image: *official-worker-image

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: comfyshop
      POSTGRES_DB: comfyshop
      POSTGRES_PASSWORD: ${COMFYSHOP_POSTGRES_PASSWORD:?set COMFYSHOP_POSTGRES_PASSWORD in the team env file}
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'comfyshop', '-d', 'comfyshop']
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rustfs:
    image: ghcr.io/rustfs/rustfs:1.0.6
    profiles: ['rustfs']
    restart: unless-stopped
    command: ['/data']
    environment:
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'false'
      RUSTFS_ACCESS_KEY: ${COMFYSHOP_S3_ACCESS_KEY_ID:-}
      RUSTFS_SECRET_KEY: ${COMFYSHOP_S3_SECRET_ACCESS_KEY:-}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health/ready']
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    volumes:
      - rustfs-data:/data

  rustfs-init:
    <<: *app-image
    extends:
      file: compose.app.yaml
      service: media-storage
    depends_on:
      rustfs:
        condition: service_healthy
        required: false
    entrypoint:
      - python
      - -c
      - |
        from urllib.parse import urlsplit
        from comfyshop_api.core.config import get_settings
        settings = get_settings()
        if settings.storage_backend == 's3':
            if urlsplit(settings.s3_endpoint_url or '').hostname == 'rustfs':
                settings.media_storage.create_bucket()
            else:
                settings.media_storage.check_bucket()
    command: []

volumes:
  data:
  postgres-data:
  rustfs-data:
