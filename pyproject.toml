[project]
name = "comfyshop-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["apps/api", "integrations/comfyui", "integrations/official-worker", "integrations/runninghub-worker", "libs/*"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "integrations/comfyui/tests", "integrations/official-worker/tests", "libs"]
markers = ["official_catalog: validates real Atlas Cloud built-in workflows and localized sync"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC", "FAST", "I", "UP", "S"]
# assert 只用于类型收窄的不变量，权限和输入校验必须显式抛错。
# 子进程参数一律以列表传入、不经过 shell，S603/S607 会对每次调用误报。
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]
"tooling/vulture_whitelist.py" = ["B018"]
# 站点地址在解析时已限定为 http/https，其余地址是固定的 https 来源。
"integrations/skills/comfyshop/scripts/comfyshop.py" = ["S310"]

[tool.ruff.lint.isort]
known-first-party = ["comfyshop_api", "comfyshop_media", "comfyshop_official_worker", "comfyshop_worker"]

[tool.pyright]
include = ["apps/api/src", "libs", "integrations/comfyui/comfyshop_worker", "integrations/comfyui/__init__.py", "integrations/runninghub-worker/comfyshop_runninghub_worker", "integrations/official-worker/comfyshop_official_worker", "integrations/skills/comfyshop/scripts", "tooling/export-openapi.py", "tooling/build-skill.py"]
extraPaths = ["apps/api/src", "integrations/comfyui", "integrations/official-worker"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"
# API 的函数参数必须标注类型，服务层内的数据库调用才会被检查。
executionEnvironments = [
    { root = "apps/api/src", reportMissingParameterType = "error" },
    { root = "libs", reportMissingParameterType = "error" },
    { root = ".", extraPaths = ["apps/api/src", "integrations/comfyui", "integrations/official-worker"] },
]

[tool.vulture]
paths = ["apps/api", "libs", "integrations", "tooling/export-openapi.py", "tooling/build-skill.py", "tooling/vulture_whitelist.py"]
exclude = ["*/apps/api/migrations/versions/*", "*/.venv/*"]
ignore_decorators = [
    "@router.get",
    "@router.post",
    "@router.put",
    "@router.patch",
    "@router.delete",
    "@app.api_route",
    "@app.exception_handler",
    "@app.middleware",
    "@event.listens_for",
    "@field_validator",
    "@model_validator",
]
ignore_names = ["NODE_CLASS_MAPPINGS", "NODE_DISPLAY_NAME_MAPPINGS", "pytestmark"]
min_confidence = 60
sort_by_size = true

[dependency-groups]
dev = [
    "loguru>=0.7,<1",
    "playwright>=1.55,<2",
    "vulture>=2,<3",
]
